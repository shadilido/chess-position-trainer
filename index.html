<!doctype html>
<html lang="en" data-theme="dark" data-board="sage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Position Trainer</title>
<meta name="description" content="Play a chess bot from random legal positions, then get a full move-by-move review.">
<meta name="theme-color" content="#141519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="bg-layer" aria-hidden="true"></div>
<div id="app">

  <!-- HOME -->
  <section id="scr-home" class="screen active">
    <header class="topbar home-top">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 45 45"><path d="M14 35.5 C14 30 17 27.5 19.5 25.5 L18 24.2 C15 25.2 12 26.2 10.2 25 C8.6 24 8.6 21.8 10 20.6 L16.5 13.5 C17.5 11 19 9.5 20.5 8.8 L21.5 5.5 L24.5 8.5 C29.5 10 33 14.5 33.5 21 C34 27 32.5 31 32 35.5 Z" fill="currentColor"/><rect x="10" y="35.5" width="25" height="4.5" rx="2.2" fill="currentColor"/></svg></span>
        <span class="brand-name">Position<b>Trainer</b></span>
      </div>
      <button class="icon-btn" data-go="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </header>
    <div class="home-body">
      <div class="hero">
        <div class="hero-board" id="hero-board"></div>
        <div class="hero-copy">
          <h1>Every game starts<br>somewhere new.</h1>
          <p>A random legal position. A bot that fights back. Improve the eval, mate, or get mated — no skipping.</p>
        </div>
      </div>

      <button class="stat-strip" data-go="stats" id="home-stats"></button>

      <div class="field">
        <div class="field-label">Position type</div>
        <div class="seg" id="mode-seg">
          <button data-mode="r">Random</button>
          <button data-mode="o">Opening</button>
          <button data-mode="m">Middle</button>
          <button data-mode="e">Endgame</button>
        </div>
      </div>

      <div class="field">
        <div class="field-label">Bot strength <span id="level-name" class="field-value"></span></div>
        <div class="levels" id="levels"></div>
      </div>

      <div class="field" id="recent-wrap" hidden>
        <div class="field-label">Recent games <button class="link" data-go="stats">See all</button></div>
        <div class="recent" id="recent"></div>
      </div>

      <div class="install-card" id="install-card" hidden></div>
    </div>
    <div class="home-foot">
      <button class="btn-play" id="btn-play"><span id="play-label">Play</span><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></button>
    </div>
  </section>

  <!-- PLAY -->
  <section id="scr-play" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-go="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tb-center">
        <span class="chip" id="play-phase">—</span>
        <span class="tb-sub" id="play-level">—</span>
      </div>
      <span class="icon-btn ghost"></span>
    </header>
    <div class="play-main" id="play-main">
    <div class="goal" id="goal">
      <div class="goal-top">
        <span class="goal-label">Goal</span>
        <span class="goal-text" id="goal-text">Setting up…</span>
        <span class="goal-now" id="goal-now"></span>
      </div>
      <div class="goal-meter"><div class="gm-fill" id="gm-fill"></div></div>
    </div>
    <div class="arena" id="play-arena">
      <div class="board-host" id="play-board"></div>
      <div class="evalbar" id="play-eval"><div class="eb-fill"></div><span class="eb-num"></span></div>
    </div>
    <div class="play-foot">
      <div class="status" id="play-status"><span class="dot"></span><span class="txt">Loading…</span></div>
      <div class="movestrip" id="play-moves"></div>
    </div>
    </div>

    <div class="sheet" id="result-sheet" hidden>
      <div class="sheet-card">
        <div class="res-head">
          <div class="res-icon" id="res-icon"></div>
          <div>
            <div class="res-title" id="res-title"></div>
            <div class="res-sub" id="res-sub"></div>
          </div>
        </div>
        <div class="res-streak" id="res-streak"></div>
        <div class="res-anal" id="res-anal"><div class="ra-bar"><div class="ra-fill" id="ra-fill"></div></div><span id="ra-text">Analyzing game…</span></div>
        <div class="res-btns">
          <button class="btn sec" id="btn-review" disabled>Review game</button>
          <button class="btn pri" id="btn-next">Next challenge</button>
        </div>
      </div>
    </div>

    <div class="promo" id="promo" hidden><div class="promo-card" id="promo-card"></div></div>
  </section>

  <!-- REVIEW -->
  <section id="scr-review" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="review-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tb-center"><span class="tb-title">Game Review</span><span class="tb-sub" id="review-sub"></span></div>
      <button class="icon-btn" id="review-next" aria-label="Next challenge" title="Next challenge"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" class="fill"/></svg></button>
    </header>
    <div class="review-layout">
      <div class="review-left">
        <div class="arena" id="review-arena">
          <div class="board-host" id="review-board"></div>
          <div class="evalbar" id="review-eval"><div class="eb-fill"></div><span class="eb-num"></span></div>
        </div>
        <div class="navrow">
          <button class="nav-btn" data-nav="first" aria-label="First"><svg viewBox="0 0 24 24"><path d="M18 6l-6 6 6 6M7 6v12"/></svg></button>
          <button class="nav-btn" data-nav="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button class="nav-btn" data-nav="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="nav-btn" data-nav="last" aria-label="Last"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M17 6v12"/></svg></button>
        </div>
      </div>
      <div class="review-panel" id="review-panel">
        <div class="coach" id="coach"></div>
        <div class="graph" id="graph"></div>
        <div class="movelist" id="movelist"></div>
      </div>
    </div>
    <div class="anal-overlay" id="anal-overlay" hidden>
      <div class="ao-card"><div class="spinner"></div><div id="ao-text">Analyzing…</div><div class="ra-bar"><div class="ra-fill" id="ao-fill"></div></div></div>
    </div>
  </section>

  <!-- STATS -->
  <section id="scr-stats" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-go="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tb-center"><span class="tb-title">Statistics</span></div>
      <span class="icon-btn ghost"></span>
    </header>
    <div class="scroll" id="stats-body"></div>
  </section>

  <!-- SETTINGS -->
  <section id="scr-settings" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-go="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tb-center"><span class="tb-title">Settings</span></div>
      <span class="icon-btn ghost"></span>
    </header>
    <div class="scroll" id="settings-body"></div>
  </section>

  <div class="boot" id="boot"><div class="spinner"></div><div>Loading engine…</div></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
